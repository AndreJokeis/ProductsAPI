<!DOCTYPE html>
<html lang="en">

<head>    
    <title>Document</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>



<body>
    <form class="container mt-4 needs-validation" novalidate>
        <h2 class="mb-4">Producto</h2>

        <!-- Nombre del Producto -->
        <div class="mb-3">
            <label for="ProductName" class="form-label">Nombre del Producto *</label>
            <input type="text" class="form-control" id="ProductName" name="ProductName" required maxlength="40">
            <div class="invalid-feedback">Por favor, ingresa el nombre del producto.</div>
        </div>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label for="SupplierId" class="form-label">Proveedor</label>
                <select class="form-select" id="SupplierId" name="SupplierId">
                    <option value="" selected>Selecciona un proveedor...</option>
                    <!-- Cargar proveedores de la api-->
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label for="CategoryId" class="form-label">Categoría</label>
                <select class="form-select" id="CategoryId" name="CategoryId">
                    <option value="" selected>Selecciona una categoría...</option>
                    <!-- Cargar categorías de la api-->
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="QuantityPerUnit" class="form-label">Cantidad por Unidad</label>
                <input type="text" class="form-control" id="QuantityPerUnit" name="QuantityPerUnit"
                    placeholder="Ej. 24 botellas de 500ml">
            </div>


            <div class="col-md-6 mb-3">
                <label for="UnitPrice" class="form-label">Precio Unitario ($)</label>
                <input type="number" class="form-control" id="UnitPrice" name="UnitPrice" step="0.01" min="0">
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="UnitsInStock" class="form-label">Unidades en Stock</label>
                <input type="number" class="form-control" id="UnitsInStock" name="UnitsInStock" min="0">
            </div>

            <div class="col-md-4 mb-3">
                <label for="UnitsOnOrder" class="form-label">Unidades en Pedido</label>
                <input type="number" class="form-control" id="UnitsOnOrder" name="UnitsOnOrder" min="0">
            </div>

            <div class="col-md-4 mb-3">
                <label for="ReorderLevel" class="form-label">Nivel de Reorden</label>
                <input type="number" class="form-control" id="ReorderLevel" name="ReorderLevel" min="0">
            </div>
        </div>

        <div class="mb-4 form-check text-start">
            <input type="checkbox" class="form-check-input" id="Discontinued" name="Discontinued" value="true">
            <label class="form-check-label" for="Discontinued">Producto Descontinuado</label>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="reset" class="btn btn-secondary">Limpiar</button>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const form = document.querySelector('form.needs-validation');

        const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                
            }, false)
            })

        async function cargarProveedores(){
            try{
                const response = await fetch('https://localhost:7214/api/Suppliers');

                if(!response.ok)
                    throw new Error(`HTTP ${response.status}`)

                const proveedores = await response.json();
                const selectSupplier = document.getElementById('SupplierId');

                proveedores.forEach(proveedor => {
                    const option = document.createElement('option');
                    option.value = proveedor.supplierId;
                    option.textContent = proveedor.companyName;
                    selectSupplier.appendChild(option);
                });
            } catch (error){
                console.log('algo salío mal al cargar los proveedores. Error: ', error)
            }
        }

        async function cargarCategorias(){
            try{
                const response = await fetch('https://localhost:7214/api/Categories');

                if(!response.ok)
                throw new Error(`HTTP ${response.status}`)

                const categories = await response.json();
                const selectCategory = document.getElementById('CategoryId');


                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.supplierId;
                    option.textContent = category.categoryName;
                    selectCategory.appendChild(option);
                });
            } catch (error){
                console.log('algo salío mal al cargar los proveedores. Error: ', error)
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarProveedores();
            cargarCategorias();
        })

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (form.checkValidity()) {
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                try {
                    const response = await fetch('https://localhost:7214/api/Products', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });
                    if (response.ok) {
                        alert('Producto registrado exitosamente');
                        form.reset();
                    } else {
                        alert('Error al registrar el producto');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error al registrar el producto');
                }
            }else{
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')

            
        });
    </script>
</body>

</html>
